{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BillingPro{% endblock %}</title>
    {% tailwind_css %}
    <style>
@media print {

    /* Hide EVERYTHING */
    body * {
        visibility: hidden !important;
    }

    /* Show ONLY invoice */
    .invoice-wrapper,
    .invoice-wrapper * {
        visibility: visible !important;
    }

    /* Kill dashboard layout */
    body,
    html {
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        background: #fff !important;
    }

    /* Remove flex & sidebar influence */
    .flex,
    aside,
    nav,
    main {
        display: block !important;
    }

    /* Position invoice cleanly */
    .invoice-wrapper {
        position: absolute;
        inset: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Remove buttons & UI */
    button,
    .action-bar,
    .no-print,
    #sidebar {
        display: none !important;
    }

    @page {
        size: A4;
        margin: 12mm;
    }
}
</style>

</head>

<body class="bg-[#F3F6FF] min-h-screen">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-60 bg-slate-900 hidden lg:flex flex-col sticky top-0 h-screen shadow-2xl">

        <!-- Brand -->
        <div class="p-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-6 w-6 text-white"
                         fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <span class="text-xl font-black text-white tracking-tight">
                    Billing<span class="text-indigo-400">Pro</span>
                </span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 space-y-2 mt-4">

            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-4 mb-2">
                Main Menu
            </div>

            <!-- Overview -->
            <a href="{% url 'dashboard' %}"
               class="flex items-center px-4 py-4 rounded-2xl transition
               {% if request.resolver_match.url_name == 'dashboard' %}
                   font-bold text-white bg-indigo-600 shadow-lg shadow-indigo-900/40
               {% else %}
                   font-semibold text-slate-400 hover:text-white hover:bg-slate-800
               {% endif %}">
                Overview
            </a>

            <!-- Invoices -->
            <a href="{% url 'invoice_create' %}"
               class="flex items-center px-4 py-4 rounded-2xl transition
               {% if 'invoice_' in request.resolver_match.url_name %}
                   font-bold text-white bg-indigo-600 shadow-lg shadow-indigo-900/40
               {% else %}
                   font-semibold text-slate-400 hover:text-white hover:bg-slate-800
               {% endif %}">
                Invoices
            </a>

            <!-- Products -->
            <a href="#"
               class="flex items-center px-4 py-4 rounded-2xl
                      font-semibold text-slate-400
                      hover:text-white hover:bg-slate-800 transition">
                Products
            </a>

            <!-- Customers -->
            <a href="#"
               class="flex items-center px-4 py-4 rounded-2xl
                      font-semibold text-slate-400
                      hover:text-white hover:bg-slate-800 transition">
                Customers
            </a>

        </nav>

        <!-- System Status -->
        <div class="p-6">
            <div class="p-5 bg-slate-800 rounded-3xl border border-white/5">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                    <span class="text-white text-[10px] font-bold uppercase tracking-wider">
                        System Active
                    </span>
                </div>
            </div>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

</div>

</body>
</html>
