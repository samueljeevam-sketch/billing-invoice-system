{% load tailwind_tags static %}

<!DOCTYPE html>
<html lang="en" class="bg-[#F3F6FF]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexora | BillingPro{% endblock %}</title>
    {% tailwind_css %}
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
       @media print {
          .no-print {
        display: none !important;
    }

    /* Remove flex layout completely */
    body > div {
        display: block !important;
    }

    /* Hide sidebar fully */
    aside {
        display: none !important;
    }

    /* Make main take full width */
    main {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Remove background */
    html, body {
        background: #ffffff !important;
    }

    /* Remove shadows */
    * {
        box-shadow: none !important;
    }
}


        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #F3F6FF; 
            color: #1E293B;
            -webkit-font-smoothing: antialiased;
        }
        /* Sidebar Deep Dark Palette */
        .sidebar-bg { background-color: #0f121d !important; }
        
        /* Active State with Gradient and Border */
        .sidebar-item-active {
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.15) 0%, rgba(79, 70, 229, 0) 100%);
            border-left: 4px solid #4f46e5;
            color: #ffffff !important;
        }
        .sidebar-item-active i { color: #818cf8 !important; }

        /* Hover States */
        .sidebar-link:hover:not(.sidebar-item-active) {
            background-color: rgba(255, 255, 255, 0.03);
            color: #ffffff;
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="flex min-h-screen">
        
        <aside class="w-64 sidebar-bg border-r border-white/5 hidden lg:flex flex-col sticky top-0 h-screen shadow-2xl z-50">
            
            <div class="pt-10 pb-8 px-8">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 flex-shrink-0">
                        <img src="{% static 'images/primeledger.png' %}"
                             class="w-full h-full object-contain filter brightness-110">
                    </div>

                    <div class="flex flex-col">
                        <span class="text-xl font-black text-white tracking-tighter uppercase leading-[0.9]">PRIME</span>
                        <span class="text-xl font-black text-white tracking-tighter uppercase leading-[0.9]">LEDGER</span>
                        <span class="text-[8px] font-bold text-indigo-500 uppercase tracking-[0.3em] mt-1.5">Intelligence</span>
                    </div>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-1.5 mt-4">
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] px-4 mb-4 opacity-40">Main Menu</div>
                
                <a href="{% url 'dashboard' %}" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all sidebar-link {% if request.resolver_match.url_name == 'dashboard' %} sidebar-item-active {% else %} text-slate-400 {% endif %}">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 transition-colors"></i>
                    <span class="text-sm font-bold uppercase tracking-wider">Overview</span>
                </a>

                <a href="{% url 'invoice_create' %}" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all sidebar-link {% if 'invoice' in request.resolver_match.url_name %} sidebar-item-active {% else %} text-slate-400 {% endif %}">
                    <i data-lucide="file-text" class="w-5 h-5 transition-colors"></i>
                    <span class="text-sm font-bold uppercase tracking-wider">Invoices</span>
                </a>

                <a href="{% url 'product_list' %}" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all sidebar-link {% if 'product' in request.resolver_match.url_name %} sidebar-item-active {% else %} text-slate-400 {% endif %}">
                    <i data-lucide="package" class="w-5 h-5 transition-colors"></i>
                    <span class="text-sm font-bold uppercase tracking-wider">Products</span>
                </a>

                <a href="#" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all sidebar-link text-slate-400">
                    <i data-lucide="users" class="w-5 h-5 transition-colors"></i>
                    <span class="text-sm font-bold uppercase tracking-wider">Customers</span>
                </a>

                <a href="#" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all sidebar-link text-slate-400">
                    <i data-lucide="bar-chart-3" class="w-5 h-5 transition-colors"></i>
                    <span class="text-sm font-bold uppercase tracking-wider">Reports</span>
                </a>
            </nav>

            <div class="p-6 mt-auto border-t border-white/2">
                <form action="#" method="post">
                    {% csrf_token %}
                    <button type="submit" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl text-rose-500 hover:bg-rose-500/10 transition-all group">
                        <i data-lucide="log-out" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                        <span class="text-sm font-bold uppercase tracking-widest">Sign Out</span>
                    </button>
                </form>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto px-12 pt-8 pb-12">
            {% block content %}{% endblock %}
        </main>
        
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
