{% extends "base.html" %}

{% block title %}PrimeLedger | Executive Terminal{% endblock %}

{% block content %}

<div class="h-full flex flex-col p-4 lg:p-6" x-data="invoiceHandler()">
    
    <header class="flex justify-between items-center mb-5 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-1.5 h-6 bg-indigo-600 rounded-full"></div>
            <h1 class="text-xl font-black text-slate-900 tracking-tighter uppercase">Transaction</h1>
        </div>
        <div class="bg-white border px-4 py-1.5 rounded-full shadow-sm flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Protocol: Secure</span>
        </div>
    </header>

    <form method="POST" action="{% url 'invoice_create' %}" class="flex-1 grid grid-cols-12 gap-6 min-h-0">
        {% csrf_token %}
        
        <!-- LEFT SIDE -->
        <div class="col-span-8 flex flex-col space-y-4 min-h-0">

            <div class="bg-white rounded-2xl p-2 border shadow-sm shrink-0">
                <select name="customer" required class="w-full bg-transparent border-none py-2 px-4 text-sm font-bold text-slate-900 focus:ring-0">
                    <option value="">Select Recipient Account...</option>
                    {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex-1 flex flex-col min-h-0 bg-white rounded-[2rem] p-6 border border-slate-200">

                <div class="flex justify-between items-center mb-6 shrink-0">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Asset Ledger</h3>
                    <button type="button" @click="addItem()" class="bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase px-4 py-2 rounded-xl hover:bg-indigo-600 hover:text-white transition-all">
                        + Add Entry
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto pr-2 space-y-3">

                    <template x-for="(item, index) in items" :key="item.id">
                        <div class="grid grid-cols-12 gap-4 items-center p-4 rounded-2xl bg-slate-50 border border-slate-100">

                            <div class="col-span-7">
                                <select name="product[]" x-model="item.productId" @change="updatePrice(index, $event)"
                                    class="w-full bg-white border-none rounded-lg text-sm font-bold py-2 px-3">
                                    <option value="">Select Asset...</option>
                                    {% for product in products %}
                                        <option value="{{ product.id }}" data-price="{{ product.price }}">
                                            {{ product.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-span-2">
                                <input type="number" name="quantity[]" min="1"
                                    x-model.number="item.qty"
                                    class="w-full bg-white border-none rounded-lg py-2 text-center font-bold">
                            </div>

                            <div class="col-span-3 flex justify-between items-center">
                                <span class="font-bold text-slate-900"
                                      x-text="'₹' + formatCurrency(item.qty * item.price)"></span>

                                <button type="button" @click="removeItem(index)" class="text-slate-400 hover:text-rose-500">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>

                                <input type="hidden" name="price[]" x-model="item.price">
                            </div>

                        </div>
                    </template>

                </div>

            </div>

        </div>
        
        <!-- RIGHT SIDE -->
        <div class="col-span-4 flex flex-col h-full">

            <div class="bg-[#0f121d] rounded-[2.5rem] p-8 flex flex-col h-full shadow-2xl">

                <div class="flex-1">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-8">
                        Financial Summary
                    </h3>

                    <div class="space-y-6">

                        <div class="flex justify-between">
                            <span class="text-slate-400 text-sm">Subtotal</span>
                            <span class="text-white font-bold"
                                  x-text="'₹' + calculateSubtotal()"></span>
                        </div>

                        <div class="flex justify-between">
                            <span class="text-slate-400 text-sm">CGST (9%)</span>
                            <span class="text-indigo-400 font-bold"
                                  x-text="'₹' + calculateCGST()"></span>
                        </div>

                        <div class="flex justify-between">
                            <span class="text-slate-400 text-sm">SGST (9%)</span>
                            <span class="text-indigo-400 font-bold"
                                  x-text="'₹' + calculateSGST()"></span>
                        </div>

                        <div class="bg-white/10 rounded-3xl p-6 mt-6">
                            <p class="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-2">
                                Net Payable
                            </p>
                            <h2 class="text-3xl font-black text-white"
                                x-text="'₹' + calculateGrandTotal()"></h2>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <button type="submit"
                        :disabled="calculateGrandTotal() == '0.00'"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-2xl text-white font-black uppercase tracking-widest disabled:opacity-30">
                        Execute Transaction
                    </button>
                </div>

            </div>

        </div>

    </form>

</div>

<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

<script>
function invoiceHandler() {
    return {
        items: [{ id: Date.now(), productId: '', qty: 1, price: 0 }],
        cgstRate: 0.09,
        sgstRate: 0.09,

        addItem() {
            this.items.push({ id: Date.now(), productId: '', qty: 1, price: 0 });
        },

        removeItem(i) {
            if (this.items.length > 1) this.items.splice(i, 1);
        },

        updatePrice(i, e) {
            const opt = e.target.options[e.target.selectedIndex];
            this.items[i].price = parseFloat(opt.dataset.price || 0);
        },

        formatCurrency(val) {
            return parseFloat(val || 0).toLocaleString('en-IN', {
                minimumFractionDigits: 2
            });
        },

        calculateSubtotal() {
            return this.formatCurrency(
                this.items.reduce((s, i) => s + (i.qty * i.price), 0)
            );
        },

        calculateCGST() {
            const sub = this.items.reduce((s, i) => s + (i.qty * i.price), 0);
            return this.formatCurrency(sub * this.cgstRate);
        },

        calculateSGST() {
            const sub = this.items.reduce((s, i) => s + (i.qty * i.price), 0);
            return this.formatCurrency(sub * this.sgstRate);
        },

        calculateGrandTotal() {
            const sub = this.items.reduce((s, i) => s + (i.qty * i.price), 0);
            const cgst = sub * this.cgstRate;
            const sgst = sub * this.sgstRate;
            return this.formatCurrency(sub + cgst + sgst);
        }
    }
}
</script>

{% endblock %}
